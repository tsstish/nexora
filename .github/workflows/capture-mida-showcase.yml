name: Capture MIDA ready showcase
on:
  push:
    branches:
      - feature/stronger-home-2026-11
    paths:
      - .github/workflows/capture-mida-showcase.yml
      - scripts/capture-mida-screens.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - run: python scripts/capture-mida-screens.py
      - name: Commit full-resolution unedited screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ready/showcase/mida-*.png
          if ! git diff --staged --quiet; then
            git commit -m "assets(mida): replace placeholders with real full-resolution screenshots"
            git push
          fi
