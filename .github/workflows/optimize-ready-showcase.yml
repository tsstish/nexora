name: Optimize NeXora Ready Screenshots
on:
  push:
    branches: [feature/stronger-home-2026-11]
    paths:
      - .github/workflows/optimize-ready-showcase.yml
      - scripts/optimize-ready-showcase.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-image-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate responsive images without cropping screenshots
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/optimize-ready-showcase.py
      - name: Commit fast previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ready/showcase/*-preview.webp public/ready/showcase/*-thumb.webp
          if ! git diff --staged --quiet; then
            git commit -m "assets(ready): commit fast WebP display and thumbnail variants"
            git pull --rebase
            git push
          fi
