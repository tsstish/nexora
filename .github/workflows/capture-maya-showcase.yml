name: Capture MAYA—LAVI Ready Screens
on:
  push:
    branches: [feature/stronger-home-2026-11]
    paths:
      - .github/workflows/capture-maya-showcase.yml
      - scripts/capture-maya-screens.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright==1.58.0
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 python -m playwright install chromium
      - name: Capture authentic MAYA—LAVI frames
        run: python scripts/capture-maya-screens.py
      - name: Commit unedited images to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ready/showcase/maya-*.png
          if ! git diff --staged --quiet; then
            git commit -m "assets(maya): add original MAYA—LAVI site captures"
            git pull --rebase
            git push
          fi
